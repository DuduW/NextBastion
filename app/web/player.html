<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NextBastion 会话回放</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#11111b;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:"Noto Sans SC",sans-serif}
  .bar{background:#181825;padding:10px 16px;display:flex;align-items:center;gap:14px;color:#cdd6f4;font-size:13px}
  .bar b{color:#89b4fa}
  #term-wrap{flex:1;padding:8px;min-height:0;background:#1e1e2e}
  .ctrl{background:#181825;padding:12px 16px;display:flex;align-items:center;gap:12px}
  button{background:#45475a;color:#cdd6f4;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px}
  button:hover{background:#585b70}
  button.primary{background:#89b4fa;color:#1e1e2e;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  input[type=range]{flex:1;accent-color:#89b4fa;height:4px}
  .speed{display:flex;gap:4px}
  .speed button{padding:6px 10px;font-size:12px;border-radius:6px}
  .speed button.on{background:#89b4fa;color:#1e1e2e;font-weight:600}
  #t-cur,#t-total{font-family:monospace;color:#a6adc8;font-size:12px;min-width:52px}
  .hint{font-size:11px;color:#6c7086}
</style>
</head>
<body>
<div class="bar">▶ 会话回放 <b id="sid"></b> · <span id="meta">加载中...</span></div>
<div id="term-wrap"></div>
<div class="ctrl">
  <button id="btn-play" class="primary" disabled>▶ 播放</button>
  <span id="t-cur">00:00</span>
  <input type="range" id="seek" min="0" max="100" value="0" disabled>
  <span id="t-total">00:00</span>
  <div class="speed" id="speeds"></div>
  <span class="hint">asciinema cast v2 · 拖动进度条跳转</span>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('token'),SID=qs.get('sid');
document.getElementById('sid').textContent=SID;
const term=new Terminal({cursorBlink:true,fontSize:13,fontFamily:'"JetBrains Mono",Consolas,monospace',
  theme:{background:'#1e1e2e',foreground:'#cdd6f4'},scrollback:5000,disableStdin:true});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);
term.open(document.getElementById('term-wrap'));fit.fit();
window.addEventListener('resize',()=>fit.fit());

let events=[],totalT=0,curT=0,playing=false,speed=1,timer=null,lastTs=null,writeIdx=-1;

const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function idxAt(t){
  let lo=0,hi=events.length-1,ans=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(events[m][0]<=t){ans=m;lo=m+1}else hi=m-1}
  return ans;
}
function writeUpTo(t){
  const n=idxAt(t);
  if(n<writeIdx){term.reset();writeIdx=-1}   // 回退则重绘
  for(let i=writeIdx+1;i<=n;i++)term.write(events[i][2]);
  writeIdx=Math.max(writeIdx,n);
}
function refreshUI(){
  document.getElementById('t-cur').textContent=fmt(curT);
  document.getElementById('seek').value=Math.floor(curT);
}
function start(){
  playing=true;document.getElementById('btn-play').textContent='⏸ 暂停';
  lastTs=performance.now();
  timer=setInterval(()=>{
    const now=performance.now();
    curT+=(now-lastTs)/1000*speed;lastTs=now;
    if(curT>=totalT){curT=totalT;writeUpTo(curT);refreshUI();stop();return}
    writeUpTo(curT);refreshUI();
  },100);
}
function stop(){playing=false;clearInterval(timer);timer=null;document.getElementById('btn-play').textContent='▶ 播放'}
function toggle(){playing?stop():start()}
window.setSpeed=s=>{speed=s;document.querySelectorAll('#speeds button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s))};
window.doSeek=t=>{
  curT=Math.min(Math.max(0,t),totalT);
  writeUpTo(curT);refreshUI();
};

async function load(){
  const r=await fetch(`/api/v1/sessions/${SID}/cast`,{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok){document.getElementById('meta').textContent='录像加载失败（无 cast 文件）';return}
  const text=await r.text();
  let header=null;
  for(const l of text.split('\n')){
    if(!l.trim())continue;
    let ev;try{ev=JSON.parse(l)}catch(e){continue}
    if(Array.isArray(ev)&&ev.length>=3&&ev[1]==='o')events.push(ev);
    else if(!header&&ev.version)header=ev;
  }
  if(!events.length){document.getElementById('meta').textContent='录像为空';return}
  totalT=events[events.length-1][0];
  if(header&&header.width){try{term.resize(header.width,header.height||32)}catch(e){}}
  document.getElementById('meta').textContent=
    (header&&header.timestamp?new Date(header.timestamp*1000).toLocaleString('zh-CN')+' · ':'')
    +events.length+' 帧 · 时长 '+fmt(totalT);
  document.getElementById('t-total').textContent=fmt(totalT);
  const sk=document.getElementById('seek');
  sk.max=Math.floor(totalT);sk.disabled=false;
  sk.oninput=e=>doSeek(+e.target.value);
  document.getElementById('speeds').innerHTML=[0.5,1,2,4,8,16].map(s=>
    `<button data-s="${s}" class="${s===1?'on':''}" onclick="setSpeed(${s})">${s}x</button>`).join('');
  const bp=document.getElementById('btn-play');
  bp.disabled=false;bp.onclick=toggle;
  doSeek(0);
}
load();
</script>
</body>
</html>
