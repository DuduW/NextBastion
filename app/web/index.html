<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextBastion 堡垒机</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--primary:#0b3d62;--primary-hover:#14548a;--primary-light:#e8f0f7;--text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--border:#e5e5ea;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
  /* 黑白显示模式（默认浅色）*/
  body{--surface:#fff;--surface-hover:#f5f5f7;--badge-green-bg:#e8f5e9;--badge-green-tx:#1b7a3d;--badge-red-bg:#fdecea;--badge-red-tx:#c0392b;--badge-orange-bg:#fff3e0;--badge-orange-tx:#b26a00;--badge-purple-bg:#f3e8ff;--badge-purple-tx:#722ed1;--badge-gray-bg:#f0f1f3;--badge-gray-tx:#666}
  body.dark{--bg:#121417;--card:#1b1e23;--surface:#1b1e23;--surface-hover:#24282e;--text:#e8eaed;--text-2:#9aa0a6;--text-3:#6b7075;--border:#2c3036;--primary:#5b9bd5;--primary-hover:#7ab3e0;--primary-light:#1f2b38;--badge-green-bg:#17301f;--badge-green-tx:#5fbf7a;--badge-red-bg:#3a1f22;--badge-red-tx:#e57373;--badge-orange-bg:#382a17;--badge-orange-tx:#e0a458;--badge-purple-bg:#2a2038;--badge-purple-tx:#b78ce0;--badge-gray-bg:#24272c;--badge-gray-tx:#9aa0a6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  #login-page{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0b3d62 0%,#14548a 55%,#1a6fb5 100%);display:flex;align-items:center;justify-content:center}
  .login-card{background:var(--surface);border-radius:20px;padding:44px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .login-logo .mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .login-logo h1{font-family:var(--serif);font-size:22px}
  .login-sub{font-size:12.5px;color:var(--text-3);margin-bottom:28px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .field input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,61,98,.08)}
  .btn-login{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;margin-top:8px}
  .btn-login:hover{background:var(--primary-hover)}
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:232px;background:var(--card);border-right:1px solid var(--border);padding:20px 14px;flex:none;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
  .brand .mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
  .brand b{font-family:var(--serif);font-size:16.5px}
  .nav-group{font-size:11px;color:var(--text-3);padding:14px 12px 6px;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;font-size:13.5px;margin-bottom:2px}
  .nav-item:hover{background:var(--surface-hover);color:var(--text)}
  .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
  .nav-item .ic{width:18px;text-align:center;font-size:15px}
  .spacer{flex:1}
  .side-user{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--border);font-size:13px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .side-user .u b{display:block;font-size:13px}.side-user .u span{font-size:11px;color:var(--text-3)}
  .btn-logout{margin-left:auto;border:none;background:none;color:var(--text-3);font-size:16px}
  .main{flex:1;padding:24px 28px;min-width:0}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .page-head h2{font-family:var(--serif);font-size:22px}
  .page-head .sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
  .card{background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .btn{padding:8px 16px;border-radius:10px;border:none;font-size:13px;font-weight:500}
  .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
  .btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
  .btn-danger{background:#fdecea;color:var(--red)}
  .btn-sm{padding:4px 12px;font-size:12px;border-radius:8px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:500}
  .badge-green{background:var(--badge-green-bg);color:var(--badge-green-tx)}.badge-red{background:var(--badge-red-bg);color:var(--badge-red-tx)}
  .badge-orange{background:var(--badge-orange-bg);color:var(--badge-orange-tx)}.badge-blue{background:var(--primary-light);color:var(--primary)}
  .badge-purple{background:var(--badge-purple-bg);color:var(--badge-purple-tx)}.badge-gray{background:var(--badge-gray-bg);color:var(--badge-gray-tx)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:12px;color:var(--text-3);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:10px 12px}
  tbody tr:hover{background:#fafbfc}
  .mono{font-family:var(--mono);font-size:12.5px}
  .search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search-bar input,.search-bar select{padding:9px 14px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:var(--surface)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  .stat .label{font-size:12.5px;color:var(--text-3)}
  .stat .value{font-family:var(--serif);font-size:32px;font-weight:700;margin:4px 0;color:var(--primary)}
  .stat .value.alert{color:var(--red)}
  .empty{text-align:center;color:var(--text-3);padding:40px 0;font-size:13px}
  /* ===== 模态框 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .modal-mask.show{display:flex}
  .modal{background:var(--card);border-radius:16px;width:520px;max-width:96vw;box-shadow:0 24px 80px rgba(0,0,0,.3);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(-12px);opacity:0}}
  .modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-head b{font-family:var(--serif);font-size:17px;color:var(--primary)}
  .modal-x{border:none;background:none;font-size:18px;color:var(--text-3);cursor:pointer}
  .modal-body{padding:20px 24px;display:grid;gap:14px}
  .m-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
  .m-row>label{font-size:12.5px;color:var(--text-2);font-weight:500;text-align:right}
  .m-row input,.m-row select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;width:100%}
  .m-row input:focus,.m-row select:focus{border-color:var(--primary)}
  .m-row .hint{font-size:11px;color:var(--text-3)}
  .m-check{display:flex;gap:16px;align-items:center;font-size:13px;flex-wrap:wrap}
  .m-check label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--text);cursor:pointer}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:#d1d1d6;border-radius:22px;transition:.2s}
  .switch .sl::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:.2s}
  .switch input:checked + .sl{background:var(--green)}
  .switch input:checked + .sl::before{transform:translateX(16px)}
  .toast{position:fixed;top:20px;right:20px;z-index:200;background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none}
  .rec-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--red);font-weight:600}
  .rec-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}

/* 规则集编辑表格 */
.rule-table{width:100%;border-collapse:collapse;font-size:12px}
  .rule-table th{color:var(--text-3);font-weight:500;padding:4px 6px;text-align:left;border-bottom:1px solid var(--border)}
  .rule-table td{padding:4px 4px}
.rule-table input,.rule-table select{width:100%;padding:6px 8px;border:1px solid #d5d9e2;border-radius:6px;background:var(--surface);font-size:12px;box-sizing:border-box;color:#1e2130}
.rule-table input:focus,.rule-table select:focus{outline:none;border-color:#0b3d62;box-shadow:0 0 0 2px rgba(11,61,98,.12)}

/* 资产协议筛选 chips */
.proto-chips{display:flex;gap:6px}
.chip{padding:6px 14px;border-radius:16px;border:1px solid #d5d9e2;background:var(--surface);color:#4b5568;font-size:12px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#0b3d62}
.chip.on{background:#0b3d62;color:#fff;border-color:#0b3d62;font-weight:600}
.lbl{display:inline-block;padding:1px 8px;margin:1px 3px 1px 0;border-radius:9px;background:#eef1f6;color:#4b5568;font-size:11px;border:1px solid #dde2ec}
</style>
</head>
<body>
<div id="login-page">
  <div class="login-card">
    <div class="login-logo"><div class="mark">🛡️</div><h1>NextBastion</h1></div>
    <div class="login-sub">轻量合规堡垒机 · V1.0 · <span id="ver-host"></span></div>
    <div class="field"><label>用户名</label><input id="login-user" placeholder="admin"></div>
    <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="初始密码见 README"></div>
    <div class="field"><label>动态口令（TOTP）</label><input id="login-totp" placeholder="6 位动态码（如启用）"></div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none"></div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="mark">🛡️</div><b>NextBastion</b></div>
      <div class="nav-group">总览</div>
      <div class="nav-item active" data-page="dashboard" data-roles="admin,auditor,user"><span class="ic">📊</span>仪表盘</div>
      <div class="nav-group">运维接入</div>
      <div class="nav-item" data-page="myassets" data-roles="admin,auditor,user"><span class="ic">🖥️</span>我的资产</div>
      <div class="nav-item" data-page="mytasks" data-roles="admin,auditor,user"><span class="ic">📋</span>我的任务</div>
      <div class="nav-group">管理</div>
      <div class="nav-item" data-page="assets" data-roles="admin"><span class="ic">🗂️</span>资产管理</div>
      <div class="nav-item" data-page="nodes" data-roles="admin"><span class="ic">🌲</span>节点管理</div>
      <div class="nav-item" data-page="assetgroups" data-roles="admin"><span class="ic">🗃️</span>资产分组</div>
      <div class="nav-item" data-page="policies" data-roles="admin"><span class="ic">🔐</span>授权管理</div>
      <div class="nav-item" data-page="users" data-roles="admin"><span class="ic">👥</span>用户管理</div>
      <div class="nav-item" data-page="roles" data-roles="admin"><span class="ic">🎭</span>角色管理</div>
      <div class="nav-item" data-page="filters" data-roles="admin"><span class="ic">🧯</span>高危规则</div>
      <div class="nav-item" data-page="settings" data-roles="admin"><span class="ic">⚙️</span>系统设置</div>
      <div class="nav-group">审计中心</div>
      <div class="nav-item" data-page="active" data-roles="admin,auditor"><span class="ic">🟢</span>在线会话</div>
      <div class="nav-item" data-page="sessions" data-roles="admin,auditor"><span class="ic">🎬</span>会话审计</div>
      <div class="nav-item" data-page="commands" data-roles="admin,auditor"><span class="ic">📜</span>命令审计</div>
      <div class="nav-item" data-page="transfers" data-roles="admin,auditor"><span class="ic">📁</span>文件传输审计</div>
      <div class="nav-item" data-page="acctscan" data-roles="admin,auditor"><span class="ic">🧾</span>账号盘点</div>
      <div class="spacer"></div>
      <div class="nav-item" id="theme-toggle" onclick="toggleTheme()" title="切换 黑/白 显示模式"><span class="ic" id="theme-ic">☀️</span><span id="theme-tx">浅色模式</span></div>
      <div class="side-user"><div class="avatar" id="u-avatar">A</div>
        <div class="u"><b id="u-name">-</b><span id="u-rolebar">-</span></div>
        <button class="btn-logout" onclick="logout()">⏻</button></div>
    </aside>
    <div style="flex:1;display:flex;min-height:0">
    <main class="main" id="main" style="flex:1 1 auto;min-width:0"></main>
    <div id="ai-wrap" style="flex:0 0 0px;min-width:0;transition:flex-basis .15s;overflow:hidden"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="modal-mask"><div class="modal" id="modal-box"></div></div>

<script>
// ===== 模态框基础 =====
function openModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal-mask').classList.add('show')}
function closeModal(){document.getElementById('modal-mask').classList.remove('show')}
document.getElementById('modal-mask').addEventListener('click',e=>{if(e.target.id==='modal-mask')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const mRow=(label,inner)=>`<div class="m-row"><label>${label}</label><div>${inner}</div></div>`;

const API = '/api/v1';
let TOKEN = sessionStorage.getItem('nb_token') || '';
let USER = JSON.parse(sessionStorage.getItem('nb_user') || 'null');
document.getElementById('ver-host').textContent = location.host;
// ===== 黑/白显示模式（localStorage 记忆，全站 body.dark）=====
function applyTheme(t){
  document.body.classList.toggle('dark',t==='dark');
  const ic=document.getElementById('theme-ic'),tx=document.getElementById('theme-tx');
  if(ic)ic.textContent=t==='dark'?'🌙':'☀️';
  if(tx)tx.textContent=t==='dark'?'深色模式':'浅色模式';
}
function toggleTheme(){
  const t=document.body.classList.contains('dark')?'light':'dark';
  localStorage.setItem('nb_theme',t);applyTheme(t);
}
applyTheme(localStorage.getItem('nb_theme')||'light');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function api(path, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  const r = await fetch(API+path, opts);
  if(r.status===401 && path!=='/auth/login'){logout();throw new Error('未认证')}
  const j = await r.json().catch(()=>({code:r.status,message:'HTTP '+r.status}));
  if(r.status>=400) throw new Error(j.detail||j.message||('HTTP '+r.status));
  return j.data;
}
const badge=(t,c)=>`<span class="badge badge-${c}">${t}</span>`;
const protoBadge=p=>p==='rdp'?badge('RDP','blue'):p==='sql'?badge('SQL','purple'):badge('SSH','green');
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmtSize=n=>{if(n==null)return '-';if(n<1024)return n+'B';const u=['KB','MB','GB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<2);return n.toFixed(1)+u[i]};

async function doLogin(){
  const err=document.getElementById('login-err');err.style.display='none';
  try{
    const d=await api('/auth/login',{method:'POST',body:JSON.stringify({
      username:document.getElementById('login-user').value.trim(),
      password:document.getElementById('login-pass').value,
      totp:document.getElementById('login-totp').value.trim()})});
    if(d.need_totp_setup){
      // F8：目录用户首登 TOTP 绑定引导
      showTotpSetup(d);
      return;
    }
    TOKEN=d.access_token;USER=d.user;
    sessionStorage.setItem('nb_token',TOKEN);sessionStorage.setItem('nb_user',JSON.stringify(USER));
    document.getElementById('login-page').style.display='none';
    document.getElementById('app').style.display='block';
    fillUserBar();go('dashboard');toast('欢迎 '+USER.username);
  }catch(e){err.textContent='登录失败：'+e.message;err.style.display='block'}
}
function showTotpSetup(d){
  const box=document.getElementById('login-err');
  box.style.display='block';box.style.background='#f6ffed';box.style.borderColor='#b7eb8f';box.style.color='#389e0d';box.style.lineHeight='1.8';
  box.innerHTML=`<b>🔐 首次登录，请绑定动态口令（TOTP）</b><br>
    1. 打开 Google Authenticator / 微信小程序「身份验证器」<br>
    2. 手动添加，密钥：<b class="mono" style="user-select:all;font-size:14px">${d.totp_secret}</b><br>
    3. 或点击 <a href="${esc(d.otpauth_url)}" style="color:#389e0d">此链接</a> 自动导入<br>
    4. 输入 6 位动态码完成登录（绑定后即刻生效）`;
  document.getElementById('login-totp').focus();
  document.getElementById('login-totp').placeholder='输入扫描后的 6 位动态码';
}
function fillUserBar(){
  document.getElementById('u-name').textContent=USER.username;
  document.getElementById('u-rolebar').textContent={admin:'系统管理员',auditor:'安全审计员',user:'运维用户'}[USER.role]||USER.role;
  document.getElementById('u-avatar').textContent=USER.username[0].toUpperCase();
  applyNavRoles();
}
function applyNavRoles(){
  document.querySelectorAll('.nav-item[data-roles]').forEach(i=>{
    const rs=i.dataset.roles.split(',');
    i.style.display = rs.includes(USER&&USER.role)?'':'none';
  });
}
const PAGE_ROLES={assets:['admin'],nodes:['admin'],policies:['admin'],users:['admin'],roles:['admin'],filters:['admin'],settings:['admin'],active:['admin','auditor'],sessions:['admin','auditor'],commands:['admin','auditor']};
function pageAllowed(p){const rs=PAGE_ROLES[p];return !rs||rs.includes(USER&&USER.role)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-page').style.display!=='none')doLogin()});
function logout(){TOKEN='';USER=null;sessionStorage.clear();location.reload()}

document.querySelectorAll('.nav-item[data-page]').forEach(i=>i.onclick=()=>go(i.dataset.page));
function go(page){
  if(!pageAllowed(page)){toast('无权访问该页面');page='myassets'}
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active',i.dataset.page===page));
  (PAGES[page]||PAGES.dashboard)().then(html=>{document.getElementById('main').innerHTML=html;if(page==='settings'){if(typeof ldapLoad==='function')ldapLoad();if(typeof foRefresh==='function')foRefresh();const u=document.getElementById('sysinfo-url');if(u){u.innerHTML='<span class=\'mono\'>'+esc(location.host)+'</span> · <b>'+esc(location.protocol==='https:'?'HTTPS':'HTTP')+'</b>';}}if(page==='myassets')myAssetsFilter();if(page==='assets')assetsFilter();if(page==='dashboard'&&typeof loadHighRisk==='function')loadHighRisk();if(page==='policies')paginateTable('#pol-table','pol');if(page==='users'){if(window.__roleFilter){const sel=document.getElementById('u-role-q');if(sel){sel.value=window.__roleFilter;}window.__roleUsersFilter&&window.__roleUsersFilter();window.__roleFilter=null;}paginateTable('#usr-table','usr');}});
}

function foChip(v,fk){
  return '<span style="display:inline-block;padding:3px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;margin:2px 4px 2px 0;background:#fafbfc">'+esc(v)+
    ' <b style="cursor:pointer;color:#e5484d;font-weight:600" data-fk="'+esc(fk)+'" data-val="'+esc(v)+'" onclick="foDel(this)">✕</b></span>';
}
function foRefresh(){
  const d=(window.__fieldOptions)||{os_type:[],label:[]};
  const box1=document.getElementById('fo-os-list');if(!box1)return;
  const grpOrder=['Linux','Windows','网络设备','其他'];
  const groups={};
  (d.os_type||[]).forEach(x=>{(groups[x.group||'其他']=groups[x.group||'其他']||[]).push(x.value);});
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=grpOrder.indexOf(a),ib=grpOrder.indexOf(b);
    return (ia<0?90:ia)-(ib<0?90:ib);
  });
  box1.innerHTML=keys.length?keys.map(g=>'<div style="margin-bottom:4px"><span style="font-size:11px;color:var(--text-3);margin-right:4px">'+esc(g)+' ·</span>'+
    groups[g].map(v=>foChip(v,'os_type')).join('')+'</div>').join(''):'<div class="hint">暂无选项</div>';
  const box2=document.getElementById('fo-label-list');

function pgGo(kind,p){
  if(kind==='sess')window.__sessPage=p;else if(kind==='tr')window.__trPage=p;else window.__cmdPage=p;
  go(kind==='sess'?'sessions':kind==='tr'?'transfers':'commands');
}
function pgSize(kind,el){
  const ps=parseInt(el.value,10)||20;
  if(kind==='sess'){window.__sessSize=ps;window.__sessPage=1;}
  else if(kind==='tr'){window.__trSize=ps;window.__trPage=1;}
  else{window.__cmdSize=ps;window.__cmdPage=1;}
  go(kind==='sess'?'sessions':kind==='tr'?'transfers':'commands');
}
function pagerHtml(kind,d){
  const page=d.page||1,pages=d.pages||1,total=d.total||0;
  const curSize=parseInt(d.page_size,10)||(kind==='sess'?window.__sessSize:kind==='tr'?window.__trSize:window.__cmdSize)||20;
  const sizeSel=`<select onchange="pgSize('${kind}',this)" style="padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg-1,#fff);color:var(--text-1,#222)">`
    +[20,50,100].map(s=>`<option value="${s}"${s===curSize?' selected':''}>${s} 条/页</option>`).join('')+`</select>`;
  if(pages<=1)return `<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><span class="hint" style="flex:1"></span><span class="hint">共 ${total} 条</span>${sizeSel}</div>`;
  const btn=(p,t,cur,dis)=>`<button class="btn btn-sm ${cur?'btn-primary':'btn-ghost'}" ${dis?'disabled style="opacity:.4"':''} ${dis?'':`onclick="pgGo('${kind}',${p})"`}>${t}</button>`;
  let start=Math.max(1,page-3),end=Math.min(pages,start+6);start=Math.max(1,end-6);
  let nums='';
  for(let p=start;p<=end;p++)nums+=btn(p,p,p===page,false);
  return `<div style="display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap">
    <span class="hint">共 ${total} 条 · 第 ${page}/${pages} 页</span>${sizeSel}<span style="flex:1"></span>
    ${btn(1,'«',false,page<=1)}${btn(page-1,'‹',false,page<=1)}${nums}${btn(page+1,'›',false,page>=pages)}${btn(pages,'»',false,page>=pages)}
  </div>`;
}

async mytasks(){

function filterAssetsTable(tableSel,inputSel,cntSel,protoVar){
  const q=(((document.getElementById(inputSel))||{}).value||'').trim().toLowerCase();
  const proto=window[protoVar];
  // 分页状态（按表独立）
  const pgKey='__pg_'+tableSel, szKey='__sz_'+tableSel;
  const rows=[...document.querySelectorAll(tableSel+' tbody tr')];
  // 命中集合
  const hit=rows.filter(tr=>(!q||(tr.dataset.search||'').includes(q))&&(!proto||tr.dataset.proto===proto));
  const size=window[szKey]||20;
  let page=window[pgKey]||1;
  const pages=Math.max(1,Math.ceil(hit.length/size));
  if(page>pages)page=pages;
  window[pgKey]=page;
  // 切片显示
  rows.forEach(tr=>tr.style.display='none');
  hit.slice((page-1)*size,page*size).forEach(tr=>tr.style.display='');
  const total=rows.length;
  const cnt=document.getElementById(cntSel);
  if(cnt)cnt.textContent=total?(hit.length+' / '+total+' 台'):'';
  // pager 条（复用审计分页样式；不足一页也显示：共 N 条 + 条/页选择）
  const holder=document.querySelector(tableSel);
  if(holder){
    let bar=holder.parentElement.querySelector('.pager-bar');
    if(!bar){bar=document.createElement('div');bar.className='pager-bar';holder.parentElement.insertBefore(bar,holder.nextSibling);}
    const btn=(p,t,cur,dis)=>`<button class="btn btn-sm ${cur?'btn-primary':'btn-ghost'}" ${dis?'disabled style="opacity:.4"':''} ${dis?'':`onclick="pgAssetGo('${tableSel}',${p})"`}>${t}</button>`;
    let nums='';
    let s2=Math.max(1,page-3),e2=Math.min(pages,s2+6);s2=Math.max(1,e2-6);
    for(let i=s2;i<=e2;i++)nums+=btn(i,i,i===page,false);
    bar.innerHTML=`<div style="display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap">
      ${pages>1?btn(page-1,'‹',false,page<=1)+nums+btn(page+1,'›',false,page>=pages):''}
      <span class="hint" style="flex:1"></span><span class="hint">共 ${hit.length} 台 · 第 ${page}/${pages} 页</span>
      <select onchange="pgAssetSz('${tableSel}',this)" style="padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface);color:var(--text)">
        ${[10,20,50,100].map(s=>`<option value="${s}"${s===size?' selected':''}>${s} 条/页</option>`).join('')}
      </select></div>`;
  }
}

// ===== 节点管理：新建/编辑弹窗 + 删除 =====
function nodeForm(nid,mode){
  const rows=window.__nodeRows||[];
  const cur=nid?rows.find(n=>n.id===nid):null;
  const isEdit=mode==='edit';
  const defParent=isEdit?(cur?cur.parent_id:null):(cur?cur.id:null);
  // 父节点候选：编辑时排除自己及子孙（防环——后端也校验）
  let banned=new Set();
  if(isEdit&&cur){const stack=[cur.id];while(stack.length){const id=stack.pop();banned.add(id);rows.filter(n=>n.parent_id===id).forEach(n=>stack.push(n.id))}}
  const opts=rows.filter(n=>!banned.has(n.id))
    .map(n=>{let d=0,p=n.parent_id;while(p!=null&&d<9){d++;p=(rows.find(x=>x.id===p)||{}).parent_id||null}
      return `<option value="${n.id}" ${defParent===n.id?'selected':''}>${'　'.repeat(d)}${esc(n.name)}</option>`}).join('');
  const title=isEdit?`编辑节点${cur?'：'+esc(cur.name):''}`:(nid?`新建子节点（父：${cur?esc(cur.name):''}）`:'新建根级节点');
  openModal(`
  <div class="modal-head"><b>${title}</b><button class="modal-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    ${mRow('节点名称',`<input id="nd-name" value="${isEdit&&cur?esc(cur.name):''}" placeholder="如：苏州 IDC / 生产区">`)}
    ${mRow('父节点',`<select id="nd-parent"><option value="">（根级 · 挂在「全部资产」下）</option>${opts}</select>`)}
    <div class="hint">授权挂父节点 = 覆盖全部子树资产；删除前需先移走子节点与资产。</div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveNode(${nid||'null'},${isEdit})">保存</button>
  </div>`);
  const s=document.getElementById('nd-parent');
  if(s)s.value=(defParent===null||defParent===undefined)?'':String(defParent);
}

// ===== 通用表格前端分页（授权/用户/用户组等：与审计分页同款样式）=====
function paginateTable(tableSel, prefix, refresh){
  const tbl=document.querySelector(tableSel);
  if(!tbl)return;
  const rows=[...tbl.querySelectorAll('tbody tr')];
  const size=window['__sz_'+prefix]||20;
  let page=window['__pg_'+prefix]||1;
  const pages=Math.max(1,Math.ceil(rows.length/size));
  if(page>pages)page=pages;
  window['__pg_'+prefix]=page;
  rows.forEach(tr=>tr.style.display='none');
  rows.slice((page-1)*size,page*size).forEach(tr=>tr.style.display='');
  // pager 条（复用审计分页样式；不足一页也显示：共 N 条 + 条/页选择）
  let bar=tbl.parentElement.querySelector('.pager-bar');
  if(!bar){bar=document.createElement('div');bar.className='pager-bar';tbl.parentElement.insertBefore(bar,tbl.nextSibling);}
  const btn=(p,t,cur,dis)=>`<button class="btn btn-sm ${cur?'btn-primary':'btn-ghost'}" ${dis?'disabled style="opacity:.4"':''} ${dis?'':`onclick="ptGo('${prefix}',${p},'${tableSel}')"`}>${t}</button>`;
  let nums='',start=Math.max(1,page-3),end=Math.min(pages,start+6);start=Math.max(1,end-6);
  for(let i=start;i<=end;i++)nums+=btn(i,i,i===page,false);
  bar.innerHTML=`<div style="display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap">
    ${pages>1?btn(page-1,'‹',false,page<=1)+nums+btn(page+1,'›',false,page>=pages):''}
    <span class="hint" style="flex:1"></span><span class="hint">共 ${rows.length} 条 · 第 ${page}/${pages} 页</span>
    <select onchange="ptSize('${prefix}',this,'${tableSel}')" style="padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface);color:var(--text)">${[20,50,100].map(s=>`<option value="${s}"${s===size?' selected':''}>${s} 条/页</option>`).join('')}</select></div>`;
}
function ptGo(prefix,p,sel){window['__pg_'+prefix]=p;paginateTable(sel,prefix);}
function ptSize(prefix,el,sel){window['__sz_'+prefix]=parseInt(el.value,10)||20;window['__pg_'+prefix]=1;paginateTable(sel,prefix);}

function frRuleRow(r,i){
  return `<tr>
    <td><input class="fr-cell" data-k="name" value="${esc(r.name||'')}" placeholder="规则名（可空）"></td>
    <td><input class="fr-cell mono" data-k="regex" value="${esc(r.regex||'')}" placeholder="如 ^rm\\s+-rf\\s+/" style="flex:1"></td>
    <td><select class="fr-cell" data-k="action">
      <option value="block" ${r.action!=='alert'?'selected':''}>🚫 阻断</option>
      <option value="alert" ${r.action==='alert'?'selected':''}>⚠️ 告警</option></select></td>
    <td><button class="btn btn-sm btn-danger" title="删除此行" onclick="this.closest('tr').remove();frCount()">✕</button></td></tr>`;
}
function frAddRow(){
  document.getElementById('fr-tbody').insertAdjacentHTML('beforeend',frRuleRow({name:'',regex:'',action:'block'},0));
  frBindLive();frCount();
  const rows=document.querySelectorAll('#fr-tbody tr');
  rows[rows.length-1].querySelector('input[data-k=regex]').focus();
}
function frBindLive(){
  document.querySelectorAll('#fr-tbody input[data-k=regex]').forEach(inp=>{
    inp.oninput=()=>{
      inp.style.borderColor='';
      inp.title='';
      if(inp.value && !frValidRe(inp.value)){inp.style.borderColor='#f38ba8';inp.title='正则语法错误';}
      frCount();
    };
  });
  frCount();
}
function frValidRe(s){try{new RegExp(s);return true}catch(e){return false}}
function frCount(){
  const el=document.getElementById('fr-count');
  if(!el)return;
  const rows=[...document.querySelectorAll('#fr-tbody tr')].filter(tr=>tr.querySelector('input[data-k=regex]').value.trim());
  el.textContent=rows.length?`${rows.length} 条有效规则`:'尚未填写规则';
}
function frTpl(kind){
  const tpl=kind==='prod'?[
    {name:'强制删除',regex:'^rm\\s+(-[a-zA-Z]*f[a-zA-Z]*|--)',action:'block'},
    {name:'格式化',regex:'^(mkfs|fdisk|parted)\\b',action:'block'},
    {name:'递归改权',regex:'^chmod\\s+-R\\s+777',action:'block'},
    {name:'_kernel 模块',regex:'^(rmmod|insmod)\\b',action:'alert'},
    {name:'计划任务',regex:'^(crontab|at)\\b',action:'alert'},
    {name:'用户管理',regex:'^(userdel|passwd)\\b',action:'alert'},
  ]:[
    {name:'强制删除',regex:'^rm\\s+-[a-zA-Z]*f[a-zA-Z]*r[a-zA-Z]*',action:'block'},
    {name:'格式化',regex:'^mkfs\\b',action:'block'},
    {name:'提权',regex:'sudo\\s+su',action:'alert'},
  ];
  document.getElementById('fr-tbody').innerHTML=tpl.map((r,i)=>frRuleRow(r,i)).join('');
  frBindLive();
}
async function saveFilter(id){
  const name=document.getElementById('f-name').value.trim();
  if(!name){toast('规则集名必填');return}
  const rules=[];const seen=new Set();let bad=0;
  document.querySelectorAll('#fr-tbody tr').forEach(tr=>{
    const get=k=>tr.querySelector(`[data-k=${k}]`);
    const regex=get('regex').value.trim();
    if(!regex)return;
    if(!frValidRe(regex)){bad++;get('regex').style.borderColor='#f38ba8';return}
    if(seen.has(regex)){return}          // 同正则去重（静默合并）
    seen.add(regex);
    rules.push({name:get('name').value.trim()||regex.slice(0,16),regex,action:get('action').value});
  });
  if(bad){toast(`${bad} 条正则语法错误，已红框标出`);return}
  if(!rules.length){toast('至少填写一条有效规则');return}
  try{
    await api('/filters'+(id?('/'+id):''),{method:id?'PUT':'POST',body:JSON.stringify({name,rules})});
    toast(id?'规则集已更新':'规则集已创建');closeModal();loadPage();
  }catch(e){toast('保存失败：'+e.message)}
}

function syslogCollect(){

async function saveTask(runNow){
  const ids=[...document.querySelectorAll('#tk-assets input:checked')].map(x=>+x.value);
  const type=document.getElementById('tk-type').value;
  const body={name:document.getElementById('tk-name').value.trim(),type,asset_ids:ids,
    script_text:document.getElementById('tk-script')?.value||null,
    cron_expr:document.getElementById('tk-cron').value.trim(),
    notify_on:document.getElementById('tk-notify').value};
  if(type==='inspect'){
    body.thresholds={cpu:+document.getElementById('tk-cpu').value||80,mem:+document.getElementById('tk-mem').value||80,temp:+document.getElementById('tk-temp').value||40};
  }
  if(type==='backup'){
    const rn=+document.getElementById('tk-ret-n')?.value||0;
    body.retention_count=rn>0?rn:null;
    body.retention_daily=!!document.getElementById('tk-ret-daily')?.checked;

    const r=await api('/tasks',{method:'POST',body:JSON.stringify(body)});
    toast('任务已创建');closeModal();loadPage();

async function ldapLoad(){
  try{
    const c=await api('/settings/ldap');
    if(c&&c.id){
      document.getElementById('ldap-enabled').checked=!!c.enabled;
      document.getElementById('ldap-url').value=c.url||'ldaps://127.0.0.1:636';
      document.getElementById('ldap-basedn').value=c.base_dn||'dc=example,dc=com';
      document.getElementById('ldap-binddn').value=c.bind_dn||'';
      document.getElementById('ldap-starttls').checked=!!c.starttls;
      document.getElementById('ldap-insecure').checked=!!c.insecure;
      document.getElementById('ldap-loginattr').value=c.login_attr||'uid';
      document.getElementById('ldap-nameattr').value=c.name_attr||'cn';
      document.getElementById('ldap-mailattr').value=c.mail_attr||'mail';
      document.getElementById('ldap-userfilter').value=c.user_filter||'(objectClass=inetOrgPerson)';
      document.getElementById('ldap-map-admin').value=c.map_admin||'';
      document.getElementById('ldap-map-auditor').value=c.map_auditor||'';
      // 角色映射回显：新格式 group_maps=[{src,dst:'admin|auditor|user'}]；旧组 id 映射忽略
      const maps=(()=>{try{return JSON.parse(c.group_maps||'[]').filter(m=>typeof m.dst==='string')}catch(e){return[]}})();
      // 兼容：若 role_map（角色管理遗留）有值也并入显示
      try{const rm=JSON.parse(c.role_map||'{}');(rm.admin||[]).forEach(dn=>maps.push({src:dn,dst:'admin'}));(rm.auditor||[]).forEach(dn=>maps.push({src:dn,dst:'auditor'}));}catch(e){}
      document.getElementById('ldap-groupmap').innerHTML='';
      maps.forEach(m=>{ldapAddMap();const rows=document.querySelectorAll('#ldap-groupmap > div');const r=rows[rows.length-1];
        r.querySelector('.ldap-src').value=m.src;r.querySelector('.ldap-dst').value=m.dst;});
      ldapToggle();
    }
  }catch(e){}
}
function ldapToggle(){
  const on=document.getElementById('ldap-enabled').checked;
  document.getElementById('ldap-form').style.display=on?'':'none';
  document.getElementById('ldap-state').textContent=on?'当前：已启用（登录走目录认证）':'当前：未启用';
  if(on&&!document.getElementById('ldap-groupmap').children.length)ldapAddMap();
}
const ROLE_OPTS=[['admin','👑 管理员'],['auditor','📜 审计员'],['user','👤 用户']];
function ldapAddMap(){
  const opts=ROLE_OPTS.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('');
  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:1fr 34px 200px 40px;gap:10px;align-items:center';
  row.innerHTML=`<input class="mono ldap-src" placeholder="cn=bastion-admins,ou=groups,dc=example,dc=com" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px">
    <span style="color:var(--text-3);text-align:center">→</span>
    <select class="ldap-dst" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px">${opts}</select>
    <button class="btn btn-sm btn-danger" onclick="this.closest('div').remove()">✕</button>`;
  document.getElementById('ldap-groupmap').appendChild(row);
}
function ldapCollect(){
  const maps=[...document.querySelectorAll('#ldap-groupmap > div')].map(r=>({
    src:r.querySelector('.ldap-src').value.trim(),dst:r.querySelector('.ldap-dst').value}));
  return {
    enabled:document.getElementById('ldap-enabled').checked,
    url:document.getElementById('ldap-url').value.trim(),
    base_dn:document.getElementById('ldap-basedn').value.trim(),
    bind_dn:document.getElementById('ldap-binddn').value.trim(),
    starttls:document.getElementById('ldap-starttls').checked,
    insecure:document.getElementById('ldap-insecure').checked,
    login_attr:document.getElementById('ldap-loginattr').value.trim(),
    name_attr:document.getElementById('ldap-nameattr').value.trim(),
    mail_attr:document.getElementById('ldap-mailattr').value.trim(),
    user_filter:document.getElementById('ldap-userfilter').value.trim(),
    map_admin:document.getElementById('ldap-map-admin').value.trim(),
    map_auditor:document.getElementById('ldap-map-auditor').value.trim(),
    group_maps:maps.filter(m=>m.src)
  };
}
function ldapValidate(c){
  if(!/^ldaps?:\/\/.+:\d+$/.test(c.url))return 'LDAP URL 格式应为 ldaps://host:636 或 ldap://host:389';
  if(!c.base_dn||!/^(dc|ou|cn)=/.test(c.base_dn))return 'Base DN 应以 dc=/ou=/cn= 开头';
  if(!c.bind_dn||!/^(cn|uid)=/.test(c.bind_dn))return 'Bind DN 格式有误';
  if(c.url.startsWith('ldap://')&&!c.starttls)return 'ldap:// 389 明文被拒绝：请改用 ldaps:// 或勾选 StartTLS';
  if(!c.login_attr)return '登录名属性必填';
  if(!c.user_filter.startsWith('(')||!c.user_filter.endsWith(')'))return 'User Filter 应为括号表达式，如 (objectClass=inetOrgPerson)';
  return '';
}

  }
  const url=`/terminal.html?token=${TOKEN}&asset=${assetId}&account=${acc.id}&user=${encodeURIComponent(USER.username)}`;
  window.open(url,'_blank');
}

async function rdpConnect(assetId){
  const accs=await api(`/assets/${assetId}/accounts`);
  if(!accs.length){
    // 无托管账号：弹窗自输账密（同 SSH）
    tempCredRdp(assetId);
    return;
  }
  try{
    await openRdp(assetId,accs[0].id);
  }catch(e){/* openRdp 已 toast 详情 */}
}
async function openRdp(assetId,accId,ct){
  let d;
  try{
    d=await api('/rdp/tokens',{method:'POST',body:JSON.stringify({
      asset_id:assetId,account_id:accId,...(ct?{ct}:{}) ,
      screen_width:1024,screen_height:768})});
  }catch(e){
    // R5 预检 502 等错误带明确 detail——直接展示
    toast(e.message||'RDP 连接失败');
    throw e;
  }
  window.__rdpCtx={assetId,accId,ct:ct||null};
  const clip=(d.rdp_config&&d.rdp_config.clipboard===true)?'#clip=1':'';
  const url=`/rdp.html?token=${encodeURIComponent(d.token)}&user=${encodeURIComponent(USER.username)}${clip}`;
  window.open(url,'_blank');
}

  const html=`<div class="modal-head"><b>🔑 输入 RDP 登录凭据</b><button class="modal-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">

  </div>

    <button class="btn btn-primary" id="tc-go" onclick="doTempRdp(${assetId})">连 接</button>
  </div>`;

async function doTempRdp(assetId){
  const login=document.getElementById('tc-login').value.trim();

  btn.disabled=true;btn.textContent='验证中…';

    const r=await api('/temp-cred',{method:'POST',body:JSON.stringify({asset_id:assetId,login,password:pass})});

// RDP 分辨率切换：子窗请求 → 申请新 token 回传（带旧 token 时走 retoken 续签，临时凭据免重输）
window.addEventListener('message',async ev=>{
  const d=ev.data||{};
  if(d.type==='nb-rdp-resize' && window.__rdpCtx){
    try{
      let r;
      if(d.token){
        // 续签：旧 token 换新分辨率 token（托管/临时凭据通用）
        r=await api('/rdp/retoken',{method:'POST',body:JSON.stringify({
          token:d.token,screen_width:d.width,screen_height:d.height})});
      }else{
        r=await api('/rdp/tokens',{method:'POST',body:JSON.stringify({
          asset_id:window.__rdpCtx.assetId,account_id:window.__rdpCtx.accId,
          ...(window.__rdpCtx.ct?{ct:window.__rdpCtx.ct}:{}),
          screen_width:d.width,screen_height:d.height})});
      }
      ev.source.postMessage({type:'nb-rdp-newtoken',token:r.token},'*');
    }catch(e){ /* 主窗口可能已过期，子窗提示 */ }
  }
});

// 已有 token 自动进入

}

<div id="ai-fab" onclick="toggleAIPanel()" style="position:fixed;right:18px;bottom:22px;z-index:901;background:var(--primary);color:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)">✨ AI 助手</div>
<script src="ai-panel.js"></script>
<script>
function toggleAIPanel(){
  const w=document.getElementById('ai-wrap');
  const open=(parseInt(localStorage.getItem('nb_ai_dash_open'))||0)===1;
  localStorage.setItem('nb_ai_dash_open',open?'0':'1');
  if(open){w.style.flexBasis='0px'}
  else{w.style.flexBasis=(parseInt(localStorage.getItem('nb_ai_width'))||Math.floor(innerWidth*0.2))+'px'}
}
window.addEventListener('DOMContentLoaded',()=>{
  if(!window.NB_AI)return;
  NB_AI.mountIfEnabled(document.getElementById('ai-wrap'),{
    scene:'dashboard',
    token:()=>TOKEN,
    onDisabled:()=>{const f=document.getElementById('ai-fab');if(f)f.style.display='none'},
    getHandle:()=>({selection:(window.getSelection().toString()||'').slice(0,500)}),
    quickActions:[
      {label:'📋 安全日报',question:'请基于本堡垒机今日的运行情况生成安全日报框架，并说明你还缺哪些数据（我会粘贴）'},
      {label:'🕵️ 异常分析',question:'我在仪表盘看到高危命令记录，请给出分析思路与处置建议'},
      {label:'📎 汇总建议',question:'请给我一份运维安全改进建议清单（基于堡垒机常见风险）'},
    ]
  });
  // 恢复上次开合状态（在组件 mount 完成初始 flexBasis 后覆盖；关闭则收 0）
  setTimeout(()=>{
    const w=document.getElementById('ai-wrap');
    if((parseInt(localStorage.getItem('nb_ai_dash_open'))||0)===1 && document.querySelector('.nb-ai')){
      w.style.flexBasis=(parseInt(localStorage.getItem('nb_ai_width'))||Math.floor(innerWidth*0.2))+'px';
    }else{
      w.style.flexBasis='0px';
    }
  },80);
});
</script>
</body>
</html>
